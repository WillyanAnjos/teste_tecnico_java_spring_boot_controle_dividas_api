services:
  postgres:
    image: postgres:16-alpine
    container_name: dividas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dividas}
      POSTGRES_USER: ${POSTGRES_USER:-dividas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dividas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dividas-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dividas}
      DB_USER: ${POSTGRES_USER:-dividas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dividas}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
